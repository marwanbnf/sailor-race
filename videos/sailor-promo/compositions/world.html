      const W = 1920, H = 1080, DUR = 52.75;
      const RETIME = [[0, 0], [3.4, 3.4], [7.35, 11.0], [10.65, 16.8], [13.6, 20.2], [15.3, 21.9], [21.1, 27.0], [22.6, 30.1], [31.0, 38.5], [37.0, 45.8], [39.65, 48.9], [43.5, 52.75]];

          const [a, b] = RETIME[i], [c, d] = RETIME[i + 1];
          if (t <= d) return a + ((t - b) * (c - a)) / (d - b);
        }
        return RETIME[RETIME.length - 1][0];
      };
      const COLORS = ["#3B82F6", "#EF4444", "#22C55E", "#8B5CF6", "#F97316"];
      const SHIP_W = 108, K = 1.227;

      // ── Board geometry, ported from src/pages/DisplayPage.tsx ──
      const SQ = 4, TOTAL = 13;
      const ISL = [{ x: 10, y: 18 }, { x: 95, y: 39 }, { x: 5, y: 71 }, { x: 94, y: 82 }];
      const SEG = [
        { cp1: { x: 52, y: 2 }, cp2: { x: 58, y: 18 } },
        { cp1: { x: 80, y: 46 }, cp2: { x: 20, y: 52 } },
        { cp1: { x: 42, y: 72 }, cp2: { x: 52, y: 78 } },
      ];
      const bez = (t, a, b, c, d) => {
        const m = 1 - t;
        return {
          x: m * m * m * a.x + 3 * m * m * t * b.x + 3 * m * t * t * c.x + t * t * t * d.x,
          y: m * m * m * a.y + 3 * m * m * t * b.y + 3 * m * t * t * c.y + t * t * t * d.y,
        };
      };
      const exactPos = (i) => {
        const c = Math.max(0, Math.min(i, TOTAL - 1));
        const s = Math.min(Math.floor(c / SQ), 2);
        return bez((c - s * SQ) / SQ, ISL[s], SEG[s].cp1, SEG[s].cp2, ISL[s + 1]);
      };
      const PX = 0.07, PY = 0.085;
      const bp = (p) => ({ x: W * PX + (p.x / 100) * (W - 2 * W * PX), y: H * PY + (p.y / 100) * (H - 2 * H * PY) });
      const tangent = (i) => {
        const c = Math.max(0, Math.min(i, TOTAL - 1));
        const s = Math.min(Math.floor(c / SQ), 2);
        const t = (c - s * SQ) / SQ, m = 1 - t;
        const p0 = ISL[s], p1 = SEG[s].cp1, p2 = SEG[s].cp2, p3 = ISL[s + 1];
        const dx = 3 * m * m * (p1.x - p0.x) + 6 * m * t * (p2.x - p1.x) + 3 * t * t * (p3.x - p2.x);
        const dy = 3 * m * m * (p1.y - p0.y) + 6 * m * t * (p2.y - p1.y) + 3 * t * t * (p3.y - p2.y);
        const vx = dx * (W * (1 - 2 * PX)) / 100, vy = dy * (H * (1 - 2 * PY)) / 100;
        const l = Math.hypot(vx, vy) || 1;
        return { x: vx / l, y: vy / l };
      };

      };
      const CROWN = `<svg viewBox="0 0 50 40"><defs><linearGradient id="w-crown-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3b0"/><stop offset="0.45" stop-color="#ffd25c"/><stop offset="1" stop-color="#d18a10"/></linearGradient></defs>

<rect x="5" y="31" width="40" height="6" rx="2" fill="#e8a21c" stroke="#7a4a05" stroke-width="2.2"/><circle cx="25" cy="5" r="3.2" fill="#ff5d4f" stroke="#7a4a05" stroke-width="1.6"/>
<circle cx="3" cy="12" r="2.6" fill="#46cfd9" stroke="#7a4a05" stroke-width="1.4"/><circle cx="47" cy="12" r="2.6" fill="#46cfd9" stroke="#7a4a05" stroke-width="1.4"/><circle cx="25" cy="25" r="3" fill="#ff5d4f"/></svg>`;

      // ── The story's data (illustrative points) ──
      // Each ship: keyframes of route index (index × 500 = points). Moves are ease-in-out-cubic, as in the app.
      const T_PULL = 12.0;
      const SHIPS = [
        { slot: 1, moves: [[22.9, 24.3, 0, 3]] },
        { slot: 2, moves: [[24.4, 26.0, 0, 4]] },
        { slot: 3, moves: [[T_PULL, 13.4, 0, 1], [26.3, 28.0, 1, 5.2]] },
        { slot: 4, moves: [[28.2, 29.2, 0, 2]] },
        { slot: 5, moves: [[29.3, 30.6, 0, 3.5]] },
      ];
      const ARRIVAL_T = 26.0;
      const io = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
      const clamp01 = (x) => Math.max(0, Math.min(1, x));
      const idxAt = (s, t) => {
        let v = s.moves[0][2];
        for (const [a, b, from, to] of s.moves) {
          if (t >= b) v = to;
          else if (t > a) { v = from + (to - from) * io((t - a) / (b - a)); break; }
          else break;
        }
        return v;
      };
      const movingAmt = (s, t) => {
        let m = 0;
        for (const [a, b] of s.moves) m = Math.max(m, clamp01((t - a + 0.15) / 0.45) * clamp01((b + 0.45 - t) / 0.55));
        return m;
      };
      // points on the tag: the new total shows as soon as the move starts
      const ptsAt = (s, t) => {
        let v = s.moves[0][2];
        for (const [a, , , to] of s.moves) if (t >= a) v = to;
        return Math.round(v * 500);
      };

      // Raw layout: route points plus the app's echelon formation for ships closer than 1.25 hull lengths.
      const rawLayout = (t) => {
        const base = SHIPS.map((s) => {
          const i = idxAt(s, t);
          const p = bp(exactPos(i));
          return { s, i, x: p.x, y: p.y, rx: p.x, ry: p.y, tan: tangent(i) };
        });
        const by = [...base].sort((a, b) => a.i - b.i || a.s.slot - b.s.slot);
        const groups = [];
        by.forEach((s) => {
          const g = groups[groups.length - 1], prev = g && g[g.length - 1];
          if (prev && Math.hypot(s.x - prev.x, s.y - prev.y) < SHIP_W * 1.25) g.push(s);
          else groups.push([s]);
        });
        groups.forEach((g) => {
          if (g.length < 2) return;
          const spacing = SHIP_W * (g.length > 3 ? 0.38 : 0.42);
          g.forEach((s, j) => {
            let nx = -s.tan.y, ny = s.tan.x;
            if (ny < 0) { nx = -nx; ny = -ny; }
            const step = j - (g.length - 1) / 2;
            const across = step * spacing, along = step * SHIP_W * (g.length > 3 ? 0.86 : 0.96);
            s.x += nx * across + s.tan.x * along;
            s.y += ny * across + s.tan.y * along;
          });
        });
        const minX = SHIP_W * 0.62, maxX = W - SHIP_W * 0.62, minY = SHIP_W * 0.72, maxY = H - SHIP_W * 0.42;
        groups.forEach((g) => {
          let dx = 0, dy = 0;
          g.forEach((s) => {
            if (s.x + dx < minX) dx = minX - s.x;
            if (s.x + dx > maxX) dx = maxX - s.x;
            if (s.y + dy < minY) dy = minY - s.y;
            if (s.y + dy > maxY) dy = maxY - s.y;
          });
          g.forEach((s) => { s.x += dx; s.y += dy; });
        });
        return base;
      };
      // Formation offsets ease in over ~0.65 s like the app's settle transition (averaged, so any frame renders alone).
      const layout = (t) => {
        const now = rawLayout(t);
        const N = 10, win = 0.65;
        const off = now.map(() => ({ x: 0, y: 0 }));
        for (let j = 0; j < N; j++) {
          const L = rawLayout(Math.max(0, t - (win * j) / (N - 1)));
          L.forEach((s, k) => { off[k].x += (s.x - s.rx) / N; off[k].y += (s.y - s.ry) / N; });
        }
        return now.map((s, k) => {
          const flip = s.tan.x >= 0 ? 1 : -1;
          const raw = flip === 1 ? Math.atan2(s.tan.y, s.tan.x) : Math.atan2(-s.tan.y, -s.tan.x);
          return { ...s, x: s.rx + off[k].x, y: s.ry + off[k].y, flip, rot: Math.max(-20, Math.min(20, (raw * 180) / Math.PI)) };
        });
      };
      const leaderIdx = (t) => Math.max(...SHIPS.map((s) => idxAt(s, t)));

      // ── Build the ships, tags, crowns, buoy overlays ──
      const shipEls = SHIPS.map((s) => {
        const el = document.getElementById("w-ship-" + s.slot);
        el.innerHTML = `<div class="w-heading"><div class="w-scale"><div class="w-bob">${dhow(COLORS[s.slot - 1], s.slot, SHIP_W, "s" + s.slot)}</div></div></div>`;
        const tw = document.getElementById("w-tagw-" + s.slot);
        tw.innerHTML = `<div class="w-crown">${CROWN.replace(/w-crown-g/g, "w-crown-g" + s.slot)}</div><div class="w-tag" style="background:${COLORS[s.slot - 1]}">فصل ${s.slot}<b>0</b></div>`;
        return {
          s, el, tw,
          heading: el.querySelector(".w-heading"), scale: el.querySelector(".w-scale"), bob: el.querySelector(".w-bob"),
          wake: el.querySelector(".wake"), wls: el.querySelectorAll(".wl"), sprays: el.querySelectorAll(".spray"),
          sail: el.querySelector(".sail"), pennant: el.querySelector(".pennant"), lbl: el.querySelector(".lbl"),
          crown: tw.querySelector(".w-crown"), pts: tw.querySelector("b"),
        };
      });
      const LAMPS = [[712.1, 107.2], [1018.8, 134.5], [1310.1, 224], [1387.8, 400.3], [946.6, 456.1], [505.4, 532], [593.4, 654], [907.4, 679.1], [1236.8, 709.2]];
      const VALS = [[686.7, 219.6, 77.5, "500"], [983.3, 246.9, 97.8, "1,000"], [1275, 336.4, 97.1, "1,500"], [1351.6, 512.7, 99.3, "2,500"], [909.7, 568.5, 100.6, "3,000"], [468.9, 644.4, 99.9, "3,500"], [556.3, 766.4, 101.1, "4,500"], [870.1, 791.5, 101.4, "5,000"], [1199.9, 821.6, 100.7, "5,500"]];
      const BUOY_IDX = [1, 2, 3, 5, 6, 7, 9, 10, 11];
      const buoys = document.getElementById("w-buoys");
      const buoyEls = BUOY_IDX.map((bi, j) => {
        const lamp = document.createElement("div");
        lamp.className = "w-lamp";
        lamp.style.left = LAMPS[j][0] + "px"; lamp.style.top = LAMPS[j][1] + "px";
        const val = document.createElement("div");
        val.className = "w-bval";
        val.style.left = VALS[j][0] + "px"; val.style.top = VALS[j][1] + "px"; val.style.width = VALS[j][2] + "px";
        val.textContent = VALS[j][3];
        buoys.appendChild(lamp); buoys.appendChild(val);
        return { bi, lamp, val };
      });

      // Confetti burst at جزيرة التحدي (seeded, so every frame renders the same).
      let seed = 7;
      const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
      const isle = bp(ISL[1]);
      const CONF_COLORS = ["#ffd25c", "#ffb627", "#ff5d4f", "#EF4444", "#46cfd9", "#fff8e8", "#22C55E"];
      const confetti = document.getElementById("w-confetti");
      const bits = Array.from({ length: 56 }, (_, n) => {
        const i = document.createElement("i");
        const w = 8 + rnd() * 8, h = 5 + rnd() * 6;
        i.style.width = w + "px"; i.style.height = h + "px"; i.style.background = CONF_COLORS[n % CONF_COLORS.length];
        confetti.appendChild(i);
        const ang = -Math.PI / 2 + (rnd() - 0.5) * Math.PI * 1.5;
        const dist = 140 + rnd() * 240;
        return { el: i, dx: Math.cos(ang) * dist - 60, dy: Math.sin(ang) * dist, rot: (rnd() - 0.5) * 900, dur: 1.3 + rnd() * 0.9, delay: rnd() * 0.25 };
      });

      // Hero dhow (slot 3, the class we follow)
      const HERO_W = 620, HERO_X = 640, HERO_Y = 640;
      document.getElementById("w-hero-bob").innerHTML = dhow(COLORS[2], 3, HERO_W, "hero");
      const hero = {
        root: document.getElementById("w-hero"), ship: document.getElementById("w-hero-ship"), bob: document.getElementById("w-hero-bob"),
        pts: document.getElementById("w-hero-pts"),
      };
      hero.wake = hero.bob.querySelector(".wake"); hero.wls = hero.bob.querySelectorAll(".wl"); hero.sprays = hero.bob.querySelectorAll(".spray");
      hero.sail = hero.bob.querySelector(".sail"); hero.pennant = hero.bob.querySelector(".pennant");

      // ── Camera: board point (cx, cy) at the frame centre, at scale s ──
      const PE = (n) => gsap.parseEase(n);
      const START3 = layout(11.4)[2]; // where ship 3 sits in the fleet when the board appears
      const CAM = [
        { t: 0, s: 2.4, x: START3.x + 150, y: START3.y + 120 },
        { t: T_PULL - 0.05, s: 2.4, x: START3.x + 150, y: START3.y + 120 },
        { t: 13.6, s: 1, x: 960, y: 540, e: "power2.inOut" },
        { t: 14.9, s: 1, x: 960, y: 540 },
        { t: 16.7, s: 1.42, x: 1500, y: 420, e: "power2.inOut" },
        { t: 18.7, s: 1.42, x: 520, y: 660, e: "power2.inOut" },
        { t: 20.4, s: 1.42, x: 1440, y: 800, e: "power2.inOut" },
        { t: 21.5, s: 1, x: 960, y: 540, e: "power2.inOut" },
        { t: 22.7, s: 1, x: 960, y: 540 },
        { t: 23.4, s: 1.22, x: 0, y: 0, e: "power2.inOut", follow: true },
        { t: 30.6, s: 1.22, x: 0, y: 0, follow: true },
        { t: 31.6, s: 1.38, x: 1450, y: 470, e: "power2.inOut" },
        { t: 36.4, s: 1.5, x: 1380, y: 500, e: "sine.inOut" },
        { t: 38.0, s: 1.75, x: 1560, y: 840, e: "power2.inOut" },
        { t: 43.5, s: 1.8, x: 1580, y: 850, e: "sine.out" },
      ];
      // While the fleet sails, the camera leans toward the ship that is moving.
      const followPt = (t) => {
        const N = 8;
        let x = 0, y = 0;
        for (let j = 0; j < N; j++) {
          const tt = t - (0.7 * j) / (N - 1);
          let best = null, bm = 0;
          SHIPS.forEach((s) => { const m = movingAmt(s, tt); if (m > bm) { bm = m; best = s; } });
          const p = best ? bp(exactPos(idxAt(best, tt))) : { x: 1100, y: 420 };
          x += (0.5 * p.x + 0.5 * 1100) / N; y += (0.5 * p.y + 0.5 * 420) / N;
        }
        return { x, y };
      };
      const camAt = (t) => {
        let a = CAM[0], b = CAM[0];
        for (let i = 0; i < CAM.length - 1; i++) {
          if (t >= CAM[i].t) { a = CAM[i]; b = CAM[i + 1]; }
        }
        const pa = a.follow ? { s: a.s, ...followPt(t) } : a;
        const pb = b.follow ? { s: b.s, ...followPt(t) } : b;
        const u = b.t > a.t ? clamp01((t - a.t) / (b.t - a.t)) : 1;
        const e = b.e ? PE(b.e)(u) : u;
        const s = pa.s + (pb.s - pa.s) * e;
        let cx = pa.x + (pb.x - pa.x) * e, cy = pa.y + (pb.y - pa.y) * e;
        // keep the board covering the frame
        const half = { x: 960 / s, y: 540 / s };
        cx = Math.max(half.x, Math.min(W - half.x, cx));
        cy = Math.max(half.y, Math.min(H - half.y, cy));
        return { s, tx: 960 - s * cx, ty: 540 - s * cy };
      };

      // ── Hero handoff: the close-up dhow shrinks into its place in the fleet ──
      const HAND_A = 10.9, HAND_B = 11.75;
      const cam0 = camAt(11.5);
      const target = { x: cam0.tx + cam0.s * START3.x, y: cam0.ty + cam0.s * START3.y, k: (SHIP_W * cam0.s) / HERO_W };
      const heroPtsAt = (t) => {
        const steps = [[4.55, 10], [5.25, 40], [5.95, 70], [6.65, 90], [7.35, 100]];
        let v = 0;
        steps.forEach(([tt, p]) => { if (t >= tt) v = p; });
        if (t >= 7.8) v = Math.round(100 + 300 * PE("power2.inOut")(clamp01((t - 7.8) / 1.05)));
        if (t >= 10.25) v = 500;
        return Math.round(v / 10) * 10;
      };
      const mod = (a, n) => ((a % n) + n) % n;

      // Ships ride steady: no bob or roll, so the film reads calm and clean.
      const animateBoat = () => ({ y: 0, r: 0 });
      const setBoatDetails = (o, t, m, ph) => {
        o.wake.setAttribute("opacity", m.toFixed(3));
        const off = (mod(t / 0.7, 1) * 28).toFixed(2);
        o.wls.forEach((w) => w.setAttribute("stroke-dashoffset", (-off).toString()));
        o.sprays.forEach((c) => c.setAttribute("opacity", "0"));
      };

      const CHIP_T = [3.45, 4.15, 4.85, 5.55, 6.25];
      const chips = [1, 2, 3, 4, 5, 6].map((n) => document.getElementById("w-chip-" + n));
      // tokens: the rest of the class's entries streaming in
      const tokens = [];
      const TOKV = ["+10", "+30", "+20", "+30", "+10", "+30", "+20", "+10", "+30", "+30", "+20", "+10", "+30", "+20"];
      const chipsHost = document.getElementById("w-chips");
      TOKV.forEach((v, n) => {
        const el = document.createElement("div");
        el.className = "w-token"; el.textContent = v; chipsHost.appendChild(el);
        tokens.push({ el, t0: 7.35 + n * 0.08, sy: 120 + rnd() * 800, sx: 1980 + rnd() * 160, arc: -80 - rnd() * 160 });
      });
      const PILL = { x: HERO_X, y: HERO_Y + 90 }; // where the points pill sits on screen

      const els = {
        cam: document.getElementById("w-cam"), heroSea: document.getElementById("w-hero-sea"),
        hglf: document.getElementById("w-hglf"), hgln: document.getElementById("w-hgln"),
        cglf: document.getElementById("w-cglf"), cgln: document.getElementById("w-cgln"),
        lg: document.getElementById("w-lead-glow"), lc: document.getElementById("w-lead-core"), lf: document.getElementById("w-lead-flow"),
      };

      function render(t) {
        // sea drift: the hero sails, so the water streams left; afterwards the app's slow drift
        const sail = Math.min(t, 11.6);
        const hx = -150 * sail + (t > 36 ? -40 * (t - 36) : 0), hy = 8 * sail + (t > 36 ? 12 * (t - 36) : 0);
        els.hgln.style.transform = `translate(${mod(hx, 360).toFixed(1)}px, ${mod(hy, 240).toFixed(1)}px)`;
        els.hglf.style.transform = `translate(${mod(hx * 0.6, 220).toFixed(1)}px, ${mod(hy * 0.6, 150).toFixed(1)}px)`;
        els.cgln.style.transform = `translate(${mod((360 / 38) * t, 360).toFixed(1)}px, ${mod((240 / 38) * t, 240).toFixed(1)}px)`;
        els.cglf.style.transform = `translate(${mod((-220 / 64) * t, 220).toFixed(1)}px, ${mod((150 / 64) * t, 150).toFixed(1)}px)`;

        // camera
        const c = camAt(t);
        els.cam.style.transform = `translate(${c.tx.toFixed(2)}px, ${c.ty.toFixed(2)}px) scale(${c.s.toFixed(4)})`;
        const camIn = clamp01((t - 10.95) / 0.6);
        const endFade = 1 - clamp01((t - 36.95) / 0.6);
        els.cam.style.opacity = (camIn * endFade).toFixed(3);
        els.heroSea.style.opacity = Math.max(1 - clamp01((t - 11.0) / 0.7), clamp01((t - 36.95) / 0.6)).toFixed(3);

        // ships
        const L = layout(t);
        const lead = leaderIdx(t);
        L.forEach((s, k) => {
          const o = shipEls[k];
          const m = movingAmt(s.s, t);
          const ph = s.s.slot * 0.7;
          const b = animateBoat(o, t, m, ph);
          o.el.style.transform = `translate(${s.x.toFixed(2)}px, ${s.y.toFixed(2)}px)`;
          o.el.style.zIndex = m > 0.05 ? 90 : 20 + Math.round(s.i) + s.s.slot;
          o.heading.style.transform = `rotate(${s.rot.toFixed(2)}deg) scaleX(${s.flip})`;
          o.lbl.setAttribute("transform", `translate(70 40) scale(${s.flip} 1)`);
          o.scale.style.transform = `scale(${(1 + 0.14 * m).toFixed(4)})`;
          o.bob.style.transform = `translateY(${b.y.toFixed(2)}px) rotate(${b.r.toFixed(2)}deg)`;
          setBoatDetails(o, t, m, ph);
          o.tw.style.transform = `translate(${s.x.toFixed(2)}px, ${s.y.toFixed(2)}px)`;
          o.tw.style.zIndex = m > 0.05 ? 96 : 95;
          o.pts.textContent = ptsAt(s.s, t).toLocaleString("en-US");
          // crown: the leader, faded in and out over ~0.4 s
          let cr = 0;
          for (let j = 0; j < 6; j++) {
            const tt = Math.max(0, t - j * 0.08);
            const li = leaderIdx(tt);
            if (li > 0.01 && Math.abs(idxAt(s.s, tt) - li) < 1e-6) cr += 1 / 6;
          }
          o.crown.style.opacity = cr.toFixed(3);
          o.crown.style.transform = "translate(0px, 1px)";
        });
        // hide the fleet's ship 3 under the hero until the handoff lands
        shipEls[2].el.style.opacity = t < HAND_B - 0.02 ? 0 : 1;
        shipEls[2].tw.style.opacity = clamp01((t - (HAND_B - 0.1)) / 0.2).toFixed(3);

        // leader's gold route and lit buoys
        const d = routeD(lead);
        els.lg.setAttribute("d", d); els.lc.setAttribute("d", d); els.lf.setAttribute("d", d);
        els.lf.setAttribute("stroke-dashoffset", (-mod(t / 1.2, 1) * 36.8).toFixed(2));
        buoyEls.forEach((bu) => {
          const lit = clamp01((lead - bu.bi + 0.02) * 5);
          bu.lamp.style.opacity = lit.toFixed(3);
          // a ship sitting on the buoy hides its value, as on the board
          let occ = 0;
          SHIPS.forEach((s) => { if (movingAmt(s, t) < 0.5) occ = Math.max(occ, clamp01(1 - Math.abs(idxAt(s, t) - bu.bi) / 0.5)); });
          bu.val.style.opacity = (lit * (1 - occ)).toFixed(3);
        });

        // confetti on the arrival at جزيرة التحدي
        bits.forEach((q) => {
          const u = (t - ARRIVAL_T - q.delay) / q.dur;
          if (u <= 0 || u >= 1) { q.el.style.opacity = 0; return; }
          const e = 1 - Math.pow(1 - u, 2.4);
          q.el.style.opacity = (u < 0.7 ? 1 : 1 - (u - 0.7) / 0.3).toFixed(3);
          q.el.style.transform = `translate(${(isle.x + q.dx * e).toFixed(1)}px, ${(isle.y - 30 + q.dy * e + 160 * u * u).toFixed(1)}px) rotate(${(q.rot * e).toFixed(1)}deg) scale(${(0.6 + 0.4 * e).toFixed(3)})`;
        });

        // hero
        hero.root.style.opacity = t < HAND_B ? 1 : 0;
        const hk = PE("power3.inOut")(clamp01((t - HAND_A) / (HAND_B - HAND_A)));
        const enter = PE("expo.out")(clamp01(t / 1.4));
        const hx0 = HERO_X - 120 * (1 - enter), hy0 = HERO_Y;
        const x = hx0 + (target.x - hx0) * hk, y = hy0 + (target.y - hy0) * hk, k = 1 + (target.k - 1) * hk;
        hero.ship.style.transform = `translate(${x.toFixed(2)}px, ${y.toFixed(2)}px) scale(${k.toFixed(4)})`;
        const hb = animateBoat(hero, t, 1 - hk, 2.1);
        hero.bob.style.transform = "none";
        setBoatDetails(hero, t, 1 - hk, 2.1);
        hero.pts.textContent = heroPtsAt(t).toLocaleString("en-US");
        const pop = Math.max(...[4.55, 5.25, 5.95, 6.65, 7.35, 10.25].map((tt) => (t >= tt && t < tt + 0.35 ? Math.sin(((t - tt) / 0.35) * Math.PI) : 0)));
        hero.pts.style.transform = `scale(${(1 + 0.28 * pop).toFixed(3)})`;

        // chips: each enters on the right, arcs into the points pill and is absorbed
        chips.forEach((el, n) => {
          const t0 = n < 5 ? CHIP_T[n] : 8.9;
          const hold = n < 5 ? 0.5 : 0.75;
          const sx = 1500 - (n % 2) * 40, sy = n < 5 ? 250 + n * 18 : 300;
          const a = clamp01((t - t0) / 0.3);
          const f = clamp01((t - t0 - 0.3 - hold) / 0.3);
          if (t < t0 || f >= 1) { el.style.opacity = 0; return; }
          const fe = PE("power3.in")(f);
          const ae = PE("expo.out")(a);
          const px = sx + 80 * (1 - ae) + (PILL.x - sx) * fe;
          const py = sy + (PILL.y - sy) * fe - Math.sin(fe * Math.PI) * 120;
          el.style.opacity = (ae * (1 - Math.max(0, (f - 0.75) / 0.25))).toFixed(3);
          el.style.transform = `translate(-50%, -50%) translate(${px.toFixed(1)}px, ${py.toFixed(1)}px) scale(${(1 - 0.55 * fe).toFixed(3)})`;
          el.style.filter = `blur(${((1 - ae) * 6).toFixed(2)}px)`;
        });
        tokens.forEach((q) => {
          const u = clamp01((t - q.t0) / 0.55);
          if (t < q.t0 || u >= 1) { q.el.style.opacity = 0; return; }
          const e = PE("power2.in")(u);
          const px = q.sx + (PILL.x - q.sx) * e, py = q.sy + (PILL.y - q.sy) * e + Math.sin(e * Math.PI) * q.arc;
          q.el.style.opacity = (u < 0.85 ? 1 : (1 - u) / 0.15).toFixed(3);
          q.el.style.transform = `translate(-50%, -50%) translate(${px.toFixed(1)}px, ${py.toFixed(1)}px) scale(${(1 - 0.4 * e).toFixed(3)})`;
        });
        document.getElementById("w-chips").style.opacity = t < HAND_A ? 1 : 0;
      }

      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      tl.to(clock, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(oldT(clock.t)) }, 0);
      render(0);
      window.__timelines["world"] = tl;
    })();
  </script>
</template>
