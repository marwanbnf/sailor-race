<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تقارير أولياء الأمور</title>
  <style>
    :root{
      --teal:#16958f;
      --teal-dark:#08736f;
      --teal-soft:#e8f6f4;
      --sand:#d7b985;
      --sand-soft:#fbf3e7;
      --ink:#173b42;
      --muted:#75878a;
      --border:#e7d8c3;
      --white:#fff;
      --green:#21885f;
      --orange:#c97b2d;
      --shadow:0 16px 45px rgba(13,86,82,.12);
    }
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(135deg,#edf6f5,#fbf3e7);font-family:Tajawal,"Segoe UI",Arial,sans-serif;color:var(--ink);min-height:100vh}
    button,input,select{font:inherit}
    .app{max-width:1180px;margin:auto;padding:28px 18px 55px}
    .hero{position:relative;overflow:hidden;background:rgba(255,255,255,.94);border:1px solid rgba(231,216,195,.8);border-radius:30px;padding:28px 32px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:22px}
    .hero:before,.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;z-index:0}
    .hero:before{background:var(--sand-soft);left:-70px;top:-95px}.hero:after{background:var(--teal-soft);right:-70px;bottom:-105px}
    .hero>*{position:relative;z-index:1}
    .brand{display:flex;align-items:center;gap:18px}.logo{width:118px;max-height:82px;object-fit:contain}.title h1{margin:0;color:var(--teal-dark);font-size:30px}.title p{margin:7px 0 0;color:var(--muted);font-weight:600}
    .generated{font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--border);padding:10px 14px;border-radius:999px;white-space:nowrap}
    .panel{margin-top:20px;background:rgba(255,255,255,.94);border:1px solid rgba(231,216,195,.85);border-radius:26px;padding:22px;box-shadow:var(--shadow)}
    .filters{display:grid;grid-template-columns:1.2fr 1.2fr 2fr;gap:14px;align-items:end}
    .field label{display:block;font-size:13px;font-weight:800;color:var(--teal-dark);margin:0 4px 7px}.field select,.field input{width:100%;height:48px;border:1px solid var(--border);border-radius:15px;background:#fff;padding:0 15px;color:var(--ink);outline:none;transition:.2s}.field select:focus,.field input:focus{border-color:var(--teal);box-shadow:0 0 0 4px rgba(22,149,143,.12)}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.stat{border:1px solid var(--border);background:linear-gradient(180deg,#fff,#fffaf4);border-radius:17px;padding:16px;text-align:center}.stat b{display:block;color:var(--teal-dark);font-size:25px}.stat span{font-size:12px;color:var(--muted);font-weight:700}
    .section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 2px 15px}.section-head h2{font-size:20px;color:var(--teal-dark);margin:0}.section-head .hint{font-size:12px;color:var(--muted)}
    .students{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .student{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;border:1px solid var(--border);background:#fff;border-radius:18px;padding:15px 16px;transition:.2s;box-shadow:0 5px 16px rgba(26,88,84,.05)}
    .student:hover{transform:translateY(-2px);border-color:#afd8d4;box-shadow:0 12px 25px rgba(26,88,84,.11)}
    .student-main{min-width:0}.student-name{font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.student-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:7px;font-size:12px}
    .status{padding:5px 9px;border-radius:999px;font-weight:800}.status.ready{color:var(--green);background:#e7f6ee}.status.empty{color:var(--orange);background:#fff1df}.score{color:var(--muted);font-weight:700}
    .student-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .open-btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border:0;border-radius:13px;padding:11px 14px;background:linear-gradient(135deg,var(--teal),var(--teal-dark));color:#fff;font-weight:800;cursor:pointer;box-shadow:0 6px 14px rgba(8,115,111,.2);transition:.2s;white-space:nowrap}.open-btn:hover{transform:translateY(-1px);filter:brightness(1.05)}
    .period-btn{background:linear-gradient(135deg,var(--sand),#b98632);box-shadow:0 6px 14px rgba(185,134,50,.22)}
    .empty-state{display:none;text-align:center;padding:45px 15px;border:1px dashed var(--border);border-radius:18px;color:var(--muted);background:#fffaf5}.empty-state strong{display:block;font-size:18px;color:var(--teal-dark);margin-bottom:7px}
    .footer{text-align:center;color:var(--teal-dark);font-weight:700;font-size:12px;margin-top:22px}
    @media(max-width:800px){.hero{padding:22px 18px;align-items:flex-start}.brand{align-items:flex-start}.logo{width:85px}.title h1{font-size:23px}.generated{display:none}.filters{grid-template-columns:1fr}.students{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}.student{padding:13px}.open-btn{padding:10px 12px}.app{padding:14px 10px 35px}}
    @media(max-width:560px){.hero{display:block}.brand{display:block;text-align:center}.logo{margin:auto}.stats{grid-template-columns:1fr}.student{grid-template-columns:1fr}.student-actions{display:grid;grid-template-columns:1fr;justify-content:stretch}.open-btn{width:100%}}
  </style>
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="brand">
        <img class="logo" id="logo" alt="ربيع القلوب">
        <div class="title">
          <h1>تقارير أولياء الأمور</h1>
          <p>اختر الحلقة والأسبوع، ثم افتح التقرير الأسبوعي أو تقرير الفترة الأولى.</p>
        </div>
      </div>
      <div class="generated" id="generatedAt"></div>
    </header>

    <section class="panel">
      <div class="filters">
        <div class="field">
          <label for="teamSelect">الحلقة</label>
          <select id="teamSelect"></select>
        </div>
        <div class="field">
          <label for="weekSelect">الأسبوع</label>
          <select id="weekSelect"></select>
        </div>
        <div class="field">
          <label for="searchInput">البحث عن طالب</label>
          <input id="searchInput" type="search" placeholder="اكتب اسم الطالب..." autocomplete="off">
        </div>
      </div>

      <div class="stats">
        <div class="stat"><b id="studentsCount">0</b><span>عدد الطلاب</span></div>
        <div class="stat"><b id="readyCount">0</b><span>لديهم بيانات</span></div>
        <div class="stat"><b id="emptyCount">0</b><span>لا توجد بيانات</span></div>
      </div>

      <div class="section-head">
        <h2 id="listTitle">طلاب الحلقة</h2>
        <div class="hint">لا يتم إنشاء أي شيت جديد عند فتح التقرير.</div>
      </div>

      <div class="students" id="students"></div>
      <div class="empty-state" id="emptyState">
        <strong>لا توجد نتائج</strong>
        غيّر الحلقة أو كلمة البحث.
      </div>
    </section>
    <div class="footer">ربيع القلوب — لوحة موحدة لعرض تقارير جميع الطلاب</div>
  </main>

  <script>
    const dashboard = <?!= dashboardJson ?>;
    const baseUrl = <?!= JSON.stringify(baseUrl) ?>;
    const initialTeamId = <?!= JSON.stringify(initialTeamId) ?>;
    const initialWeek = Number(<?!= JSON.stringify(initialWeek) ?>) || 1;
    const teacherName = <?!= JSON.stringify(teacherName) ?>;
    const logoDataUrl = <?!= JSON.stringify(logoDataUrl) ?>;

    const teamSelect = document.getElementById('teamSelect');
    const weekSelect = document.getElementById('weekSelect');
    const searchInput = document.getElementById('searchInput');
    const studentsEl = document.getElementById('students');
    const emptyState = document.getElementById('emptyState');

    document.getElementById('logo').src = logoDataUrl;
    document.getElementById('generatedAt').textContent = 'آخر تحديث: ' + dashboard.generatedAt;

    dashboard.teams.forEach(team => {
      const option = document.createElement('option');
      option.value = team.id;
      option.textContent = team.name;
      option.selected = team.id === initialTeamId;
      teamSelect.appendChild(option);
    });

    dashboard.weeks.forEach(week => {
      const option = document.createElement('option');
      option.value = String(week.number);
      option.textContent = week.title;
      option.selected = week.number === initialWeek;
      weekSelect.appendChild(option);
    });

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function normalize(value) {
      return String(value || '')
        .trim()
        .replace(/[\u064B-\u065F\u0670]/g, '')
        .replace(/ـ/g, '')
        .replace(/[أإآ]/g, 'ا')
        .replace(/ى/g, 'ي')
        .replace(/ة/g, 'ه')
        .replace(/\s+/g, ' ')
        .toLowerCase();
    }

    function reportUrl(teamId, studentName, week) {
      const params = new URLSearchParams({
        action: 'parentReport',
        studentName,
        teamId,
        week: String(week),
        teacherName,
        // يمنع المتصفح من عرض نسخة قديمة بعد تعديل التقرير في Google Sheets.
        refresh: String(Date.now())
      });
      return baseUrl + '?' + params.toString();
    }

    function periodReportUrl(teamId, studentName) {
      const params = new URLSearchParams({
        action: 'parentPeriodReport',
        studentName,
        teamId,
        teacherName,
        refresh: String(Date.now())
      });
      return baseUrl + '?' + params.toString();
    }

    function render() {
      const teamId = teamSelect.value;
      const week = Number(weekSelect.value) || 1;
      const query = normalize(searchInput.value);
      const team = dashboard.teams.find(item => item.id === teamId);
      const allStudents = team ? team.students : [];
      const students = allStudents.filter(student => !query || normalize(student.name).includes(query));

      const readyTotal = allStudents.filter(student => student.weeks[week] && student.weeks[week].hasData).length;
      document.getElementById('studentsCount').textContent = allStudents.length;
      document.getElementById('readyCount').textContent = readyTotal;
      document.getElementById('emptyCount').textContent = Math.max(0, allStudents.length - readyTotal);
      document.getElementById('listTitle').textContent = (team ? team.name : 'الحلقة') + ' — ' + (dashboard.weeks.find(w => w.number === week)?.title || '');

      studentsEl.innerHTML = students.map(student => {
        const stat = student.weeks[week] || { hasData:false, points:0, target:0, percent:0, recordCount:0 };
        const status = stat.hasData
          ? `<span class="status ready">جاهز</span>`
          : `<span class="status empty">لا توجد بيانات</span>`;
        const score = stat.hasData
          ? `${stat.points} من ${stat.target} — ${stat.percent}%`
          : `0 من ${stat.target}`;
        const url = reportUrl(teamId, student.name, week);
        const periodUrl = periodReportUrl(teamId, student.name);
        const periodWeeks = [1, 2, 3].map(n => student.weeks[n] || { points:0, target:0, recordCount:0 });
        const periodPoints = periodWeeks.reduce((sum,item) => sum + Number(item.points || 0), 0);
        const periodTarget = periodWeeks.reduce((sum,item) => sum + Number(item.target || 0), 0);
        const periodHasData = periodWeeks.some(item => Number(item.recordCount || 0) > 0);
        const periodPercent = periodTarget ? Math.max(0, Math.min(100, Math.round((periodPoints / periodTarget) * 100))) : 0;
        const periodLabel = periodHasData
          ? `الفترة الأولى: ${periodPoints} من ${periodTarget} — ${periodPercent}%`
          : `الفترة الأولى: لا توجد بيانات`;

        return `<article class="student">
          <div class="student-main">
            <div class="student-name">${escapeHtml(student.name)}</div>
            <div class="student-meta">${status}<span class="score">${escapeHtml(score)}</span><span class="score">${escapeHtml(periodLabel)}</span></div>
          </div>
          <div class="student-actions">
            <a class="open-btn" href="${escapeHtml(url)}" target="_self">التقرير الأسبوعي</a>
            <a class="open-btn period-btn" href="${escapeHtml(periodUrl)}" target="_self">تقرير الفترة الأولى</a>
          </div>
        </article>`;
      }).join('');

      emptyState.style.display = students.length ? 'none' : 'block';
      studentsEl.style.display = students.length ? 'grid' : 'none';


      const pageParams = new URLSearchParams(location.search);
      pageParams.set('action', 'parentReports');
      pageParams.set('teamId', teamId);
      pageParams.set('week', String(week));
      pageParams.set('teacherName', teacherName);
      history.replaceState(null, '', location.pathname + '?' + pageParams.toString());
    }

    teamSelect.addEventListener('change', render);
    weekSelect.addEventListener('change', render);
    searchInput.addEventListener('input', render);
    render();
  </script>
</body>
</html>
